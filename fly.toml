# Fly.io app config for a single long-polling worker (no HTTP service).
# REJECTED as prod (ADR-0001): kept only as an optional, non-prod fallback.
# Prod = Vercel webhook + Neon Postgres (README "Deploy").
app = "dolzhok"
primary_region = "ams"

[build]

# SQLite must live on the persistent volume, not the ephemeral rootfs.
[[mounts]]
  source = "data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/bot.db"
  LOG_LEVEL = "INFO"

# 512MB: python + aiogram + pydantic + sqlalchemy imports already need ~196MB,
# so a 256MB machine OOMs. Keep this in sync with `flyctl machine update`.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"