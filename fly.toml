# Fly.io app config for a single long-polling worker (no HTTP service).
# Deploy: docs/PLAN.md P4 / docs/specs/SPEC-004-deploy.md / README "Deploy".
app = "tg-bot-dad-ozon"
primary_region = "ams"

[build]

# SQLite must live on the persistent volume, not the ephemeral rootfs.
[mounts]
  source = "data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/bot.db"
  LOG_LEVEL = "INFO"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
