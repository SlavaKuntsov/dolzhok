[project]
name = "dolzhok"
version = "0.1.0"
description = "Telegram bot: customer sends Ozon links, executor orders, bot tracks debt"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3,<4",
  "sqlalchemy[asyncio]>=2",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "alembic>=1.13",
  "pydantic>=2",
  "pydantic-settings>=2",
  # Imported by alembic/env.py to load DATABASE_URL from .env.
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  # Editor LSP (`make pyright`) — same engine Zed runs, pinned here so it does
  # not have to be fetched with `uvx` on every check.
  "basedpyright>=1.40",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# T20 (pyflakes-print) and TID (flake8-tidy-imports) encode the mechanical
# rules from AGENTS.md §3/§8, so they fail here instead of in review.
select = ["E", "F", "I", "UP", "B", "T20", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
# Layering (AGENTS §3): domain/ and use_cases/ stay framework-free. The
# layers below opt out via per-file-ignores.
banned-module-level-imports = ["aiogram", "sqlalchemy", "pydantic"]

[tool.ruff.lint.per-file-ignores]
# Fatal CLI messages printed to stderr before logging is configured.
"src/main.py" = ["T20", "TID253"]
# Framework-facing layers and the composition root (AGENTS §3).
"src/adapters/**" = ["TID253"]
"src/infrastructure/**" = ["TID253"]
"alembic/**" = ["TID253"]
"tests/**" = ["TID253"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.alembic]
script_location = "alembic"

# Vercel Python runtime entrypoint (overrides auto-detection, which would
# otherwise pick up src/main.py and look for an `app` there).
[tool.vercel]
entrypoint = "asgi:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
